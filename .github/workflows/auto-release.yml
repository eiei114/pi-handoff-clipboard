name: Auto Release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Create release for new version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release request
        id: check
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release workflow must be dispatched from main." >&2
            exit 1
          fi

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG="v${CURRENT_VERSION}"

          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)
          if [ -n "$LATEST_TAG" ] && [ "${LATEST_TAG#v}" = "$CURRENT_VERSION" ]; then
            echo "Package version ${CURRENT_VERSION} is already the latest tagged release; skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "Tag $TAG already exists; skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release requested for ${CURRENT_VERSION}."
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          NOTES="Released ${TAG}."
          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger publish workflow
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          gh workflow run publish.yml --ref "$TAG" -f ref="$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
